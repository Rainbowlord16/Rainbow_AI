<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Balanced Rainbow Gradient -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Sleek Core Gradient -->
    <linearGradient id="crownSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Centered, Symmetrical Neon Group -->
  <g filter="url(#neonGlow)">
    <!-- Outer Concentric Ring (Modern Arch / Ring Fusion) -->
    <path d="M 90 380 
             C 90 130, 410 130, 410 380 
             L 360 380 
             C 360 170, 140 170, 140 380 Z" 
          fill="url(#rainbowGrad)" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-opacity="0.5" />

    <!-- Inner Symmetrical Ring -->
    <path d="M 170 380 
             C 170 230, 330 230, 330 380 
             L 285 380 
             C 285 260, 215 260, 215 380 Z" 
          fill="#0b0f19" 
          opacity="0.9" />

    <!-- Modern Crown Peaks Integrated at the Top Center -->
    <path d="M 215 230 L 250 175 L 285 230 Z" 
          fill="none" 
          stroke="url(#crownSheen)" 
          stroke-width="8" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Central Floating Apex Crown Diamond/Node -->
    <circle cx="250" cy="155" r="7" fill="#f59e0b" />
  </g>
</svg>
