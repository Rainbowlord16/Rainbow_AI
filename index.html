<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow AI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    
    <!-- Code Highlight & Markdown -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

    <style>
      :root {
        --bg-main: #0b0f19;
        --sidebar-bg: #0d121f;
        --panel-bg: rgba(18, 24, 38, 0.7);
        --input-bg: #111726;
        --border-color: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(99, 102, 241, 0.4);
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --text-muted: #6b7280;
        --accent-blue: #3b82f6;
        --accent-cyan: #06b6d4;
        --accent-purple: #8b5cf6;
        --status-green: #10b981;
        --status-red: #ef4444;
        --pill-blue-bg: rgba(30, 58, 138, 0.35);
        --pill-blue-border: rgba(59, 130, 246, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body, html {
        width: 100%;
        height: 100%;
        font-family: 'Google Sans', 'Inter', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        overflow: hidden;
      }

      #neuralCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
      }

      .app-layout {
        position: relative;
        z-index: 1;
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        padding: 16px 14px;
        gap: 16px;
      }

      .brand-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.3px;
      }

      .brand-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
      }

      .nav-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nav-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .nav-btn.active {
        background-color: #1e293b;
        border-color: rgba(255, 255, 255, 0.08);
      }

      .nav-btn:hover:not(.active) {
        background-color: rgba(255, 255, 255, 0.04);
      }

      .sidebar-section-title {
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        padding: 8px 8px 4px 8px;
      }

      .search-box {
        display: flex;
        align-items: center;
        background: #111827;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 7px 10px;
        gap: 8px;
      }

      .search-box input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-primary);
        font-size: 0.82rem;
        width: 100%;
        font-family: inherit;
      }

      .recent-history {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .history-item {
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 0.82rem;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: all 0.15s;
      }

      .history-item:hover, .history-item.active {
        background-color: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
      }

      /* Main Stage */
      .main-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .top-navbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 24px;
        gap: 12px;
      }

      .engine-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        background-color: var(--pill-blue-bg);
        border: 1px solid var(--pill-blue-border);
        color: #93c5fd;
      }

      .engine-pill.status {
        background-color: rgba(17, 24, 39, 0.7);
        border-color: var(--border-color);
        color: var(--text-secondary);
      }

      .dot-indicator {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: var(--status-red);
      }

      /* Chat Thread */
      .chat-thread {
        flex: 1;
        overflow-y: auto;
        padding: 20px 20% 140px 20%;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .chat-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 85%;
      }

      .chat-row.user {
        align-self: flex-end;
      }

      .chat-row.assistant {
        align-self: flex-start;
      }

      .chat-bubble {
        padding: 13px 18px;
        border-radius: 12px;
        font-size: 0.93rem;
        line-height: 1.6;
      }

      .chat-row.user .chat-bubble {
        background-color: #1e293b;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .chat-row.assistant .chat-bubble {
        background-color: var(--panel-bg);
        border: 1px solid var(--border-color);
      }

      pre {
        background: #0f141c;
        border-radius: 8px;
        padding: 12px;
        margin: 10px 0;
        overflow-x: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
      }

      /* Prompts Shelf */
      .composer-shelf {
        position: absolute;
        bottom: 24px;
        left: 20%;
        right: 20%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .suggestion-chips {
        display: flex;
        gap: 8px;
      }

      .sugg-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: rgba(17, 24, 39, 0.85);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 0.78rem;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .sugg-chip:hover {
        background-color: #1f2937;
        color: var(--text-primary);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Text Input Card */
      .composer-card {
        background-color: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .composer-card:focus-within {
        border-color: var(--border-focus);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
      }

      textarea {
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.92rem;
        max-height: 140px;
        width: 100%;
      }

      .composer-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .tool-buttons {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tool-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 0.82rem;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: color 0.15s;
      }

      .tool-btn:hover {
        color: var(--text-secondary);
      }

      .send-action-btn {
        background-color: #2563eb;
        border: none;
        color: white;
        border-radius: 8px;
        padding: 6px 16px;
        font-size: 0.85rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
      }

      .send-action-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <canvas id="neuralCanvas"></canvas>

    <div class="app-layout">
      <!-- Restored Sidebar Interface -->
      <aside class="sidebar">
        <div class="brand-header">
          <div class="brand-icon">🌈</div>
          <span>Rainbow AI</span>
        </div>

        <div class="nav-group">
          <button class="nav-btn active">
            <span>💬</span> Chat
          </button>
          <button class="nav-btn" id="newChatBtn">
            <span>＋</span> New Chat
          </button>
        </div>

        <div class="sidebar-section-title">AI Persona</div>
        <div class="nav-group">
          <button class="nav-btn">
            <span>⚡</span> Balanced
          </button>
        </div>

        <div class="sidebar-section-title">Search</div>
        <div class="search-box">
          <span>🔍</span>
          <input type="text" placeholder="Search chats..." id="searchInput" />
        </div>

        <div class="sidebar-section-title">Recent History</div>
        <div class="recent-history" id="historyList"></div>
      </aside>

      <!-- Main Chat Stage -->
      <main class="main-stage">
        <div class="top-navbar">
          <div class="engine-pill" id="vramMonitor">
            ⚡ WebGPU: Inactive
          </div>
          <div class="engine-pill status">
            <div class="dot-indicator" id="engineDot"></div>
            <span id="statusDiv">Initializing Engine...</span>
          </div>
        </div>

        <div class="chat-thread" id="messagesContainer"></div>

        <div class="composer-shelf">
          <div class="suggestion-chips">
            <button class="sugg-chip" onclick="injectPrompt('Explain quantum superposition in simple terms.')">
              ⚛️ Quantum Physics
            </button>
            <button class="sugg-chip" onclick="injectPrompt('Write a clean Python script using BeautifulSoup to scrape a webpage.')">
              🐍 Python Web Scraper
            </button>
            <button class="sugg-chip" onclick="injectPrompt('Write a short scene of a cyber-samurai entering a neon street market.')">
              📖 Cyberpunk Story
            </button>
          </div>

          <div class="composer-card">
            <textarea
              id="userInput"
              rows="1"
              placeholder="Message Rainbow AI..."
              disabled
            ></textarea>
            <div class="composer-actions">
              <div class="tool-buttons">
                <button class="tool-btn" type="button">📁 Import File</button>
                <button class="tool-btn" type="button">🎙️ Voice Input</button>
              </div>
              <button class="send-action-btn" id="sendBtn" disabled>Send</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- WebLLM Module Integration -->
    <script type="module">
      import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm@0.2.48";

      const statusDiv = document.getElementById("statusDiv");
      const vramMonitor = document.getElementById("vramMonitor");
      const engineDot = document.getElementById("engineDot");
      const userInput = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const messagesContainer = document.getElementById("messagesContainer");
      const historyList = document.getElementById("historyList");
      const newChatBtn = document.getElementById("newChatBtn");

      let engine = null;
      let chatSessions = JSON.parse(localStorage.getItem("rainbow_sessions") || "[]");
      let activeSessionId = null;

      // Particle background simulation
      function setupParticles() {
        const canvas = document.getElementById("neuralCanvas");
        const ctx = canvas.getContext("2d");
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        const particles = Array.from({ length: 45 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          radius: Math.random() * 2 + 1,
          color: ["#ff416c", "#8a2be2", "#00d2ff"][Math.floor(Math.random() * 3)]
        }));

        window.addEventListener("resize", () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        });

        function loop() {
          ctx.clearRect(0, 0, w, h);
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;

            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const d = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (d < 140) {
                ctx.strokeStyle = `rgba(138, 43, 226, ${0.15 * (1 - d / 140)})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          }
          requestAnimationFrame(loop);
        }
        loop();
      }
      setupParticles();

      // Native WebLLM initialization resolving Gemma 2 2B automatically
      async function initAI() {
        try {
          const selectedModel = "gemma-2-2b-it-q4f16_1-MLC";

          engine = await CreateMLCEngine(selectedModel, {
            initProgressCallback: (report) => {
              statusDiv.textContent = report.text;
            }
          });

          statusDiv.textContent = "● Rainbow AI Ready";
          engineDot.style.backgroundColor = "var(--status-green)";
          vramMonitor.textContent = "⚡ WebGPU: Active (Gemma 2)";
          userInput.disabled = false;
          sendBtn.disabled = false;

          renderHistory();
          if (chatSessions.length > 0) {
            loadSession(chatSessions[0].id);
          } else {
            createNewSession();
          }
        } catch (err) {
          statusDiv.textContent = "Engine Link Error";
          engineDot.style.backgroundColor = "var(--status-red)";
          vramMonitor.textContent = "⚡ WebGPU: Error";
          console.error("Initialization error:", err);
        }
      }

      // Chat session state management
      function saveSessions() {
        localStorage.setItem("rainbow_sessions", JSON.stringify(chatSessions));
      }

      function createNewSession() {
        const id = "sess_" + Date.now();
        const session = { id, title: "New Conversation", messages: [] };
        chatSessions.unshift(session);
        saveSessions();
        renderHistory();
        loadSession(id);
      }

      function loadSession(id) {
        activeSessionId = id;
        messagesContainer.innerHTML = "";
        const session = chatSessions.find((s) => s.id === id);
        if (!session) return;

        session.messages.forEach((m) => appendMessageUI(m.role, m.content));
        renderHistory();
      }

      function renderHistory() {
        historyList.innerHTML = "";
        chatSessions.forEach((s) => {
          const div = document.createElement("div");
          div.className = `history-item ${s.id === activeSessionId ? "active" : ""}`;
          div.textContent = s.title;
          div.onclick = () => loadSession(s.id);
          historyList.appendChild(div);
        });
      }

      function appendMessageUI(role, content) {
        const wrapper = document.createElement("div");
        wrapper.className = `chat-row ${role}`;

        const bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.innerHTML = role === "assistant" ? marked.parse(content) : content;

        wrapper.appendChild(bubble);
        messagesContainer.appendChild(wrapper);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return bubble;
      }

      // Stream generation
      async function handleSend() {
        const text = userInput.value.trim();
        if (!text || !engine) return;

        userInput.value = "";
        userInput.style.height = "auto";
        appendMessageUI("user", text);

        const session = chatSessions.find((s) => s.id === activeSessionId);
        if (session) {
          if (session.messages.length === 0) {
            session.title = text.slice(0, 24) + "...";
            renderHistory();
          }
          session.messages.push({ role: "user", content: text });
          saveSessions();
        }

        const assistantBubble = appendMessageUI("assistant", "...");
        assistantBubble.textContent = "";

        try {
          const messagesPayload = session
            ? session.messages.map((m) => ({ role: m.role, content: m.content }))
            : [{ role: "user", content: text }];

          const completion = await engine.chat.completions.create({
            messages: messagesPayload,
            stream: true,
            temperature: 0.3,
            top_p: 0.95
          });

          let fullResponse = "";
          for await (const chunk of completion) {
            const token = chunk.choices[0]?.delta?.content || "";
            fullResponse += token;
            assistantBubble.innerHTML = marked.parse(fullResponse);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }

          if (session) {
            session.messages.push({ role: "assistant", content: fullResponse });
            saveSessions();
          }
        } catch (err) {
          assistantBubble.textContent = "Error generating response: " + err.message;
        }
      }

      // Input auto-sizing & key listeners
      userInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";
      });

      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      sendBtn.addEventListener("click", handleSend);
      newChatBtn.addEventListener("click", createNewSession);

      window.injectPrompt = function (str) {
        userInput.value = str;
        userInput.focus();
      };

      // Boot
      initAI();
    </script>
  </body>
</html>
