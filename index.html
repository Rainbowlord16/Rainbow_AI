<!doctype html>
<html
  lang="en"
  data-theme="dark"
  data-accent="rainbow"
  data-font-size="md"
  data-reduced-motion="false"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Rainbow AI — Intelligent, secure, multi-persona AI assistant with Prompt Studio, Rainbow Canvas, Projects, Branching, and Code Lab."
    />
    <meta name="theme-color" content="#090a0f" />
    <meta name="color-scheme" content="dark light" />
    <title>Rainbow AI — Intelligent Workspace</title>

    <!-- Rainbow AI favicon -->
    <link rel="icon" type="image/png" href="./icon-new.png" />
    <link rel="apple-touch-icon" href="./icon-new.png" />

    <!-- Google Sans & JetBrains Mono Hierarchy -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..900&family=Google+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Core Sanitization, Markdown & Syntax Highlighting -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <style>
      /* ==========================================================================
       1. DESIGN TOKENS & CSS CUSTOM PROPERTIES
       ========================================================================== */
      :root {
        --rainbow-red: #ff4d4d;
        --rainbow-orange: #ff9f1c;
        --rainbow-yellow: #ffea00;
        --rainbow-green: #00e676;
        --rainbow-cyan: #00e5ff;
        --rainbow-blue: #2979ff;
        --rainbow-violet: #d500f9;

        --gradient-rainbow: linear-gradient(
          135deg,
          var(--rainbow-red) 0%,
          var(--rainbow-orange) 18%,
          var(--rainbow-yellow) 36%,
          var(--rainbow-green) 54%,
          var(--rainbow-cyan) 72%,
          var(--rainbow-blue) 88%,
          var(--rainbow-violet) 100%
        );

        --gradient-rainbow-subtle: linear-gradient(
          90deg,
          rgba(255, 77, 77, 0.16),
          rgba(255, 159, 28, 0.16),
          rgba(0, 230, 118, 0.16),
          rgba(41, 121, 255, 0.16),
          rgba(213, 0, 249, 0.16)
        );

        --gradient-rainbow-border: linear-gradient(
          120deg,
          #ff4d4d,
          #ff9f1c,
          #00e676,
          #00e5ff,
          #2979ff,
          #d500f9
        );

        /* Default Dark Theme Surfaces */
        --bg-app: #090a0f;
        --bg-sidebar: #0e1017;
        --bg-surface-1: #131620;
        --bg-surface-2: #191d2b;
        --bg-surface-3: #222738;
        --bg-surface-hover: rgba(255, 255, 255, 0.055);
        --bg-surface-active: rgba(255, 255, 255, 0.09);
        --bg-glass: rgba(19, 22, 32, 0.88);
        --bg-modal-backdrop: rgba(4, 5, 10, 0.78);
        --bg-code: #0c0e14;
        --bg-code-header: #151924;
        --bg-user-bubble: #1e2436;
        --bg-ai-bubble: transparent;

        /* Text Hierarchy */
        --text-primary: #f3f5f9;
        --text-secondary: #b4bcd0;
        --text-muted: #7e879d;
        --text-disabled: #50586c;
        --text-inverse: #090a0f;

        /* Accents */
        --accent-primary: #5b8cff;
        --accent-primary-hover: #7aa2ff;
        --accent-secondary: #a855f7;
        --accent-soft: rgba(91, 140, 255, 0.15);
        --accent-glow: rgba(91, 140, 255, 0.32);
        --focus-ring: 0 0 0 2px var(--bg-app), 0 0 0 4px var(--accent-primary);

        /* Borders */
        --border-subtle: rgba(255, 255, 255, 0.07);
        --border-default: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.22);
        --border-accent: rgba(91, 140, 255, 0.45);

        /* Status Colors */
        --status-success: #10b981;
        --status-success-bg: rgba(16, 185, 129, 0.14);
        --status-warning: #f59e0b;
        --status-warning-bg: rgba(245, 158, 11, 0.14);
        --status-danger: #ef4444;
        --status-danger-bg: rgba(239, 68, 68, 0.14);
        --status-info: #3b82f6;
        --status-info-bg: rgba(59, 130, 246, 0.14);

        /* Layout */
        --sidebar-width: 280px;
        --sidebar-collapsed-width: 68px;
        --canvas-width: 46%;
        --header-height: 60px;
        --composer-max-width: 840px;
        --chat-max-width: 840px;

        /* Radii */
        --radius-xs: 6px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 22px;
        --radius-full: 9999px;

        /* Shadows */
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.28);
        --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.6);
        --shadow-rainbow: 0 4px 24px -4px rgba(41, 121, 255, 0.25), 0 4px 24px -4px rgba(213, 0, 249, 0.2);

        /* Fonts */
        --font-sans: "Google Sans Flex", "Google Sans", "Google Sans Text", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --font-size-base: 0.96875rem;
        --line-height-base: 1.65;

        /* Motion */
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        --duration-fast: 140ms;
        --duration-normal: 220ms;

        /* Z-Index Scale */
        --z-base: 1;
        --z-sticky: 20;
        --z-composer: 30;
        --z-canvas: 40;
        --z-sidebar: 50;
        --z-sidebar-backdrop: 45;
        --z-modal-backdrop: 80;
        --z-modal: 90;
        --z-toast: 100;
      }

      [data-theme="light"] {
        --bg-app: #f7f8fc;
        --bg-sidebar: #eef1f8;
        --bg-surface-1: #ffffff;
        --bg-surface-2: #f1f4fb;
        --bg-surface-3: #e4e9f5;
        --bg-surface-hover: rgba(15, 23, 42, 0.05);
        --bg-surface-active: rgba(15, 23, 42, 0.09);
        --bg-glass: rgba(255, 255, 255, 0.88);
        --bg-modal-backdrop: rgba(15, 23, 42, 0.52);
        --bg-code: #0f131c;
        --bg-code-header: #191f2e;
        --bg-user-bubble: #e7edfe;
        --bg-ai-bubble: transparent;

        --text-primary: #0f172a;
        --text-secondary: #334155;
        --text-muted: #64748b;
        --text-disabled: #94a3b8;
        --text-inverse: #ffffff;

        --border-subtle: rgba(15, 23, 42, 0.07);
        --border-default: rgba(15, 23, 42, 0.13);
        --border-strong: rgba(15, 23, 42, 0.24);

        --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.08);
        --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
        --shadow-lg: 0 18px 48px rgba(15, 23, 42, 0.18);
      }

      [data-theme="midnight"] {
        --bg-app: #020306;
        --bg-sidebar: #05070d;
        --bg-surface-1: #090c16;
        --bg-surface-2: #0e1322;
        --bg-surface-3: #161c32;
        --border-subtle: rgba(120, 160, 255, 0.08);
        --border-default: rgba(120, 160, 255, 0.15);
      }

      /* Base Reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: var(--bg-app);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: var(--line-height-base);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button, input, select, textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        background: none;
        border: none;
      }

      button {
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      button:disabled, input:disabled, select:disabled, textarea:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      :focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.22); border-radius: var(--radius-full); }
      ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .hidden { display: none !important; }

      .rainbow-topline {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2.5px;
        background: var(--gradient-rainbow);
        z-index: 120;
        pointer-events: none;
        opacity: 0.95;
      }

      /* Shell */
      .app-shell {
        display: flex;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding-top: 2.5px;
        overflow: hidden;
        position: relative;
        background-color: var(--bg-app);
      }

      /* Sidebar */
      .sidebar {
        width: var(--sidebar-width);
        min-width: var(--sidebar-width);
        max-width: var(--sidebar-width);
        height: 100%;
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        z-index: var(--z-sidebar);
        transition: width var(--duration-normal) var(--ease-out), min-width var(--duration-normal) var(--ease-out), max-width var(--duration-normal) var(--ease-out), transform var(--duration-normal) var(--ease-out);
        overflow: hidden;
        user-select: none;
      }

      .app-shell.sidebar-collapsed .sidebar {
        width: var(--sidebar-collapsed-width);
        min-width: var(--sidebar-collapsed-width);
        max-width: var(--sidebar-collapsed-width);
      }

      .app-shell.sidebar-collapsed .sidebar .hide-on-collapse {
        opacity: 0;
        pointer-events: none;
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        display: none !important;
      }

      .sidebar-header {
        height: var(--header-height);
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      .brand-logo-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        padding: 4px;
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--bg-surface-2);
        border: 1px solid var(--border-default);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: var(--shadow-rainbow);
        overflow: hidden;
      }

      .brand-icon img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      .brand-text-wrap {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
      }

      .brand-title {
        font-size: 1.02rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: var(--gradient-rainbow);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .brand-subtitle {
        font-size: 0.6875rem;
        font-weight: 500;
        color: var(--text-muted);
      }

      .sidebar-top-actions {
        padding: 10px 10px 6px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
      }

      .new-chat-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, rgba(91, 140, 255, 0.16), rgba(168, 85, 247, 0.14));
        border: 1px solid var(--border-accent);
        color: var(--text-primary);
        font-weight: 600;
        font-size: 0.875rem;
        transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast);
      }

      .new-chat-btn:hover {
        background: linear-gradient(135deg, rgba(91, 140, 255, 0.25), rgba(168, 85, 247, 0.22));
        box-shadow: var(--shadow-rainbow);
        transform: translateY(-1px);
      }

      .sidebar-search-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .sidebar-search-icon {
        position: absolute;
        left: 10px;
        width: 15px;
        height: 15px;
        color: var(--text-muted);
        pointer-events: none;
      }

      .sidebar-search-input {
        width: 100%;
        padding: 8px 30px 8px 32px;
        background-color: var(--bg-surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        color: var(--text-primary);
      }

      .sidebar-search-input:focus {
        border-color: var(--accent-primary);
        background-color: var(--bg-surface-2);
        outline: none;
      }

      .sidebar-search-clear {
        position: absolute;
        right: 6px;
        width: 20px;
        height: 20px;
        border-radius: var(--radius-full);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
      }

      .sidebar-modules {
        padding: 4px 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 8px;
        flex-shrink: 0;
      }

      .sidebar-nav-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        font-size: 0.835rem;
        font-weight: 500;
        color: var(--text-secondary);
        transition: background-color var(--duration-fast), color var(--duration-fast);
      }

      .sidebar-nav-btn-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .sidebar-nav-btn svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        color: var(--text-muted);
      }

      .sidebar-nav-btn:hover {
        background-color: var(--bg-surface-hover);
        color: var(--text-primary);
      }

      .sidebar-nav-btn.active {
        background-color: var(--accent-soft);
        color: var(--text-primary);
        font-weight: 600;
      }

      .sidebar-nav-btn.active svg { color: var(--accent-primary); }

      .nav-badge {
        font-size: 0.6875rem;
        font-weight: 600;
        padding: 1px 7px;
        border-radius: var(--radius-full);
        background-color: var(--bg-surface-3);
        color: var(--text-secondary);
      }

      .sidebar-history {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .history-item-row {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        min-width: 0;
      }

      .history-item {
        flex: 1;
        min-width: 0;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 0.835rem;
        transition: background-color var(--duration-fast), color var(--duration-fast);
      }

      .history-item:hover, .history-item.active {
        background-color: var(--bg-surface-2);
        color: var(--text-primary);
      }

      .history-action-btn {
        flex: 0 0 26px;
        height: 26px;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        background: var(--bg-surface-1);
        color: var(--text-secondary);
        display: grid;
        place-items: center;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .history-action-btn:hover {
        background: var(--bg-surface-2);
        color: var(--text-primary);
      }

      .history-action-btn.danger:hover {
        color: var(--status-danger);
        border-color: var(--status-danger);
      }

      .sidebar-footer {
        padding: 8px 10px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
        background-color: var(--bg-sidebar);
      }

      .gateway-status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        background-color: var(--bg-surface-1);
        border: 1px solid var(--border-subtle);
        font-size: 0.75rem;
        color: var(--text-secondary);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: var(--radius-full);
        flex-shrink: 0;
        background-color: var(--status-success);
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
      }

      .status-dot.offline {
        background-color: var(--status-danger);
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      }

      .sidebar-footer-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background-color: var(--bg-modal-backdrop);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: var(--z-sidebar-backdrop);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--duration-normal) var(--ease-out);
      }

      /* Main Viewport */
      .workspace-main {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: var(--bg-app);
        overflow: hidden;
      }

      .workspace-header {
        height: var(--header-height);
        padding: 0 16px;
        border-bottom: 1px solid var(--border-subtle);
        background-color: var(--bg-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        z-index: var(--z-sticky);
        flex-shrink: 0;
      }

      .header-left, .header-center, .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-left { min-width: 0; flex: 1; }

      .mobile-menu-btn {
        display: none;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-subtle);
        background: var(--bg-surface-1);
        color: var(--text-primary);
        place-items: center;
        flex-shrink: 0;
      }

      .header-chat-title {
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 260px;
        padding: 4px 6px;
        border-radius: var(--radius-xs);
        cursor: pointer;
      }

      .control-pill-select {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        background-color: var(--bg-surface-1);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .control-pill-select select {
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-weight: 500;
        cursor: pointer;
      }

      .mode-toggle-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-secondary);
        background-color: var(--bg-surface-1);
        border: 1px solid var(--border-subtle);
        transition: all var(--duration-fast);
      }

      .mode-toggle-btn.active {
        color: var(--text-primary);
        background: var(--accent-soft);
        border-color: var(--border-accent);
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        border: 1px solid transparent;
        transition: background-color var(--duration-fast), color var(--duration-fast);
        flex-shrink: 0;
      }

      .icon-btn:hover {
        background-color: var(--bg-surface-hover);
        color: var(--text-primary);
      }

      .workspace-body {
        flex: 1;
        min-height: 0;
        display: flex;
        width: 100%;
        position: relative;
        overflow: hidden;
      }

      .chat-column {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .chat-scroll-container {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px 16px 40px;
        scroll-behavior: smooth;
        position: relative;
      }

      .chat-stream-inner {
        max-width: var(--chat-max-width);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
      }

      /* Welcome Screen */
      .welcome-screen {
        max-width: 780px;
        margin: auto;
        padding: 40px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 24px;
      }

      .welcome-prism-badge {
        width: 62px;
        height: 62px;
        border-radius: 20px;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-default);
        box-shadow: var(--shadow-rainbow);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .welcome-prism-badge img {
        width: 38px;
        height: 38px;
        object-fit: contain;
      }

      .welcome-heading {
        font-size: clamp(1.6rem, 3.2vw, 2.3rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.25;
      }

      .welcome-subtext {
        max-width: 540px;
        font-size: 0.95rem;
        color: var(--text-secondary);
        margin-top: 8px;
      }

      .starter-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
        margin-top: 10px;
      }

      .starter-card {
        padding: 14px;
        border-radius: var(--radius-md);
        background-color: var(--bg-surface-1);
        border: 1px solid var(--border-subtle);
        text-align: left;
        font-size: 0.875rem;
        color: var(--text-primary);
        transition: background-color var(--duration-fast), transform var(--duration-fast);
      }

      .starter-card:hover {
        background-color: var(--bg-surface-2);
        transform: translateY(-2px);
      }

      /* Message Rows */
      .message-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        animation: messageSlideIn var(--duration-normal) var(--ease-out);
      }

      .message-row.user-row { align-items: flex-end; }
      .message-row.assistant-row { align-items: flex-start; }

      .message-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--text-muted);
        padding: 0 4px;
      }

      .message-avatar {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      .assistant-avatar-img {
        object-fit: cover;
        border-radius: 7px;
        border: 1px solid var(--border-default);
      }

      .user-avatar {
        background: var(--accent-soft);
        color: var(--accent-primary);
        border: 1px solid var(--border-accent);
      }

      .message-bubble {
        position: relative;
        max-width: 100%;
        font-size: var(--font-size-base);
        line-height: var(--line-height-base);
        color: var(--text-primary);
        word-break: break-word;
      }

      .user-row .message-bubble {
        max-width: min(85%, 680px);
        background-color: var(--bg-user-bubble);
        border: 1px solid var(--border-default);
        padding: 12px 16px;
        border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
      }

      .assistant-row .message-bubble {
        width: 100%;
        background-color: var(--bg-ai-bubble);
        padding: 4px 0;
      }

      .message-bubble pre {
        background: var(--bg-code);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 14px;
        margin: 10px 0;
        overflow-x: auto;
        font-family: var(--font-mono);
      }

      .message-bubble code:not(pre code) {
        font-family: var(--font-mono);
        font-size: 0.86em;
        padding: 2px 6px;
        border-radius: 4px;
        background-color: var(--bg-surface-2);
        color: var(--rainbow-cyan);
      }

      .message-actions {
        display: flex;
        gap: 6px;
        opacity: 0.8;
        margin-top: 4px;
      }

      .message-action-btn {
        font-size: 0.72rem;
        padding: 4px 8px;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        background: var(--bg-surface-1);
        color: var(--text-secondary);
        cursor: pointer;
      }

      .message-action-btn:hover {
        background: var(--bg-surface-2);
        color: var(--text-primary);
      }

      /* Composer */
      .composer-region {
        width: 100%;
        padding: 8px 16px 14px;
        background: linear-gradient(180deg, transparent 0%, var(--bg-app) 28%);
        z-index: var(--z-composer);
        flex-shrink: 0;
      }

      .composer-container {
        max-width: var(--composer-max-width);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .composer-box {
        position: relative;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-surface-1);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        padding: 8px 12px;
        box-shadow: var(--shadow-sm);
        transition: border-color var(--duration-fast);
      }

      .composer-box:focus-within {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 1px var(--accent-primary), var(--shadow-rainbow);
        background-color: var(--bg-surface-2);
      }

      .composer-textarea {
        width: 100%;
        min-height: 40px;
        max-height: 180px;
        resize: none;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-size: var(--font-size-base);
        line-height: 1.5;
        padding: 4px;
        overflow-y: auto;
      }

      .composer-textarea:focus { outline: none; }

      .composer-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 6px;
        border-top: 1px solid var(--border-subtle);
        margin-top: 4px;
      }

      .composer-tools-left, .composer-tools-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .composer-tool-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .composer-tool-btn:hover {
        background-color: var(--bg-surface-hover);
        color: var(--text-primary);
      }

      .send-btn, .stop-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px;
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .send-btn {
        background: var(--gradient-rainbow);
        color: #090a0f;
      }

      .send-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: var(--shadow-rainbow);
      }

      .send-btn:disabled {
        background: var(--bg-surface-3);
        color: var(--text-disabled);
      }

      .stop-btn {
        background-color: var(--status-danger-bg);
        border: 1px solid rgba(239, 68, 68, 0.45);
        color: var(--status-danger);
      }

      /* Canvas Drawer */
      .canvas-drawer {
        width: var(--canvas-width);
        min-width: 360px;
        max-width: 680px;
        height: 100%;
        background-color: var(--bg-surface-1);
        border-left: 1px solid var(--border-default);
        display: flex;
        flex-direction: column;
        z-index: var(--z-canvas);
      }

      .canvas-header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: var(--bg-surface-2);
      }

      .canvas-title-input {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .canvas-textarea {
        flex: 1;
        width: 100%;
        resize: none;
        padding: 16px;
        background-color: var(--bg-app);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 0.875rem;
        line-height: 1.6;
        border: none;
      }

      .canvas-textarea:focus { outline: none; }

      /* Modals */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background-color: var(--bg-modal-backdrop);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: var(--z-modal-backdrop);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .modal-dialog {
        width: 100%;
        max-width: 640px;
        max-height: min(88vh, 740px);
        background-color: var(--bg-surface-1);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: var(--z-modal);
      }

      .modal-header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: var(--bg-surface-2);
      }

      .modal-tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 18px;
        background-color: var(--bg-surface-2);
        border-bottom: 1px solid var(--border-subtle);
        overflow-x: auto;
      }

      .modal-tab-btn {
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .modal-tab-btn.active {
        background-color: var(--accent-soft);
        color: var(--accent-primary);
        font-weight: 600;
      }

      .modal-body {
        padding: 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .modal-footer {
        padding: 10px 18px;
        border-top: 1px solid var(--border-subtle);
        background-color: var(--bg-surface-2);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-label {
        font-size: 0.825rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .form-input, .form-select, .form-textarea {
        width: 100%;
        padding: 9px 12px;
        border-radius: var(--radius-sm);
        background-color: var(--bg-surface-2);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        font-size: 0.875rem;
      }

      .form-input:focus, .form-select:focus, .form-textarea:focus {
        border-color: var(--accent-primary);
        outline: none;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        font-size: 0.825rem;
        font-weight: 600;
      }

      .btn-primary { background-color: var(--accent-primary); color: #ffffff; }
      .btn-secondary { background-color: var(--bg-surface-3); border: 1px solid var(--border-default); color: var(--text-primary); }
      .btn-danger { background-color: var(--status-danger-bg); border: 1px solid rgba(239, 68, 68, 0.4); color: var(--status-danger); }

      /* ==========================================================================
       CUSTOM DIALOG MODALS (REPLACING NATIVE BROWSER ALERTS/CONFIRMS/PROMPTS)
       ========================================================================== */
      .rainbow-dialog-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(4, 6, 12, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        animation: fadeIn var(--duration-fast) var(--ease-out);
      }

      .rainbow-dialog-card {
        width: min(440px, 94vw);
        border: 1px solid var(--border-strong);
        border-radius: 20px;
        padding: 22px;
        background: var(--bg-surface-1);
        color: var(--text-primary);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        animation: scaleIn var(--duration-normal) var(--ease-out);
      }

      .rainbow-dialog-card h2 {
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 8px;
        background: var(--gradient-rainbow);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .rainbow-dialog-card p {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 18px;
      }

      .rainbow-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      /* Toasts */
      .toast-region {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: var(--z-toast);
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }

      .toast-item {
        pointer-events: auto;
        padding: 10px 14px;
        border-radius: var(--radius-md);
        background-color: var(--bg-surface-2);
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-md);
        color: var(--text-primary);
        font-size: 0.835rem;
        border-left: 4px solid var(--accent-primary);
        animation: messageSlideIn var(--duration-normal) var(--ease-out);
      }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
      @keyframes messageSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      /* ==========================================================================
       MOBILE RESPONSIVENESS (PHONES & TABLETS)
       ========================================================================== */
      @media (max-width: 768px) {
        .mobile-menu-btn { display: grid; }

        .sidebar {
          position: fixed;
          top: 2.5px;
          left: 0;
          bottom: 0;
          width: 82vw !important;
          max-width: 320px !important;
          min-width: unset !important;
          transform: translateX(-105%);
          box-shadow: var(--shadow-lg);
          z-index: 60;
        }

        .app-shell.mobile-sidebar-open .sidebar {
          transform: translateX(0);
        }

        .app-shell.mobile-sidebar-open .sidebar-backdrop {
          display: block;
          opacity: 1;
          pointer-events: auto;
          z-index: 55;
        }

        .sidebar-collapse-btn { display: none !important; }

        .header-chat-title { max-width: 150px; }
        .control-pill-select select { max-width: 140px; }
        .hide-on-mobile { display: none !important; }

        .starter-grid { grid-template-columns: 1fr; }

        .chat-scroll-container { padding: 14px 10px 24px; }
        .composer-region { padding: 6px 10px 12px; }

        .user-row .message-bubble { max-width: 92%; }

        .canvas-drawer {
          position: fixed;
          top: 2.5px;
          right: 0;
          bottom: 0;
          width: 100vw;
          min-width: unset;
          max-width: unset;
          box-shadow: var(--shadow-lg);
        }

        .toast-region {
          left: 14px;
          right: 14px;
          bottom: 14px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Top Rainbow Line -->
    <div class="rainbow-topline" aria-hidden="true"></div>

    <div id="appShell" class="app-shell">
      <!-- Mobile Sidebar Backdrop -->
      <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <!-- SIDEBAR -->
      <aside id="sidebar" class="sidebar" aria-label="Workspace navigation">
        <div class="sidebar-header">
          <button id="brandHomeBtn" type="button" class="brand-logo-btn" title="Rainbow AI — New Chat">
            <span class="brand-icon">
              <img src="./icon-new.png" alt="Rainbow AI" />
            </span>
            <span class="brand-text-wrap hide-on-collapse">
              <span class="brand-title">Rainbow AI</span>
              <span class="brand-subtitle">Intelligent Workspace</span>
            </span>
          </button>

          <button id="sidebarCollapseBtn" type="button" class="icon-btn sidebar-collapse-btn" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18" />
            </svg>
          </button>
        </div>

        <div class="sidebar-top-actions">
          <button id="newChatBtn" type="button" class="new-chat-btn">
            <span style="display:flex; align-items:center; gap:8px;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span class="hide-on-collapse">New Chat</span>
            </span>
          </button>

          <div class="sidebar-search-wrap hide-on-collapse">
            <svg class="sidebar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input id="sidebarSearchInput" type="search" class="sidebar-search-input" placeholder="Search chats..." autocomplete="off" />
            <button id="sidebarSearchClearBtn" type="button" class="sidebar-search-clear hidden">✕</button>
          </div>
        </div>

        <nav class="sidebar-modules">
          <button id="openPromptStudioBtn" type="button" class="sidebar-nav-btn">
            <span class="sidebar-nav-btn-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
              <span class="hide-on-collapse">Prompt Studio</span>
            </span>
          </button>

          <button id="sidebarCanvasBtn" type="button" class="sidebar-nav-btn">
            <span class="sidebar-nav-btn-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
              <span class="hide-on-collapse">Rainbow Canvas</span>
            </span>
          </button>
        </nav>

        <div id="chatHistoryList" class="sidebar-history hide-on-collapse" role="region" aria-label="Conversation history"></div>

        <div class="sidebar-footer">
          <div class="gateway-status-bar hide-on-collapse">
            <div style="display:flex; align-items:center; gap:8px;">
              <span id="gatewayStatusDot" class="status-dot"></span>
              <span id="gatewayStatusText">Gateway Ready</span>
            </div>
          </div>

          <div class="sidebar-footer-actions">
            <button id="openSettingsBtn" type="button" class="sidebar-nav-btn" style="flex:1;">
              <span class="sidebar-nav-btn-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
                <span class="hide-on-collapse">Settings</span>
              </span>
            </button>
          </div>
        </div>
      </aside>

      <!-- MAIN WORKSPACE -->
      <main class="workspace-main">
        <header class="workspace-header">
          <div class="header-left">
            <button id="mobileMenuBtn" type="button" class="mobile-menu-btn" aria-label="Open sidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 id="activeChatTitle" class="header-chat-title" tabindex="0">New Conversation</h1>
          </div>

          <div class="header-center">
            <label class="control-pill-select" title="Active AI Model">
              <select id="modelSelect">
                <option value="Rainbow-AI-12B-Unified" selected>Rainbow-AI-12B-Unified</option>
              </select>
            </label>
          </div>

          <div class="header-right">
            <button id="canvasToggleBtn" type="button" class="mode-toggle-btn hide-on-mobile">
              <span>Canvas</span>
            </button>
            <button id="exportCurrentChatBtn" type="button" class="icon-btn" title="Export Markdown">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
            </button>
            <button id="clearCurrentChatBtn" type="button" class="icon-btn" title="Clear Conversation">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
            </button>
          </div>
        </header>

        <div class="workspace-body">
          <section class="chat-column">
            <div id="chatScrollContainer" class="chat-scroll-container">
              <div id="chatStreamInner" class="chat-stream-inner">
                <div id="welcomeScreen" class="welcome-screen">
                  <div class="welcome-prism-badge">
                    <img src="./icon-new.png" alt="Rainbow AI" />
                  </div>
                  <div>
                    <h2 class="welcome-heading">Where shall we begin?</h2>
                    <p class="welcome-subtext">Your self-hosted AI workspace powered by Rainbow-AI-12B-Unified.</p>
                  </div>
                  <div id="starterPromptsGrid" class="starter-grid"></div>
                </div>

                <div id="messagesList" style="display:flex; flex-direction:column; gap:18px; width:100%;"></div>
              </div>
            </div>

            <!-- Composer -->
            <div class="composer-region">
              <div class="composer-container">
                <div class="composer-box">
                  <textarea id="composerInput" class="composer-textarea" rows="1" placeholder="Message Rainbow-AI-12B-Unified..."></textarea>
                  <div class="composer-toolbar">
                    <div class="composer-tools-left">
                      <button id="attachFileBtn" type="button" class="composer-tool-btn">Attach</button>
                      <button id="composerPromptStudioBtn" type="button" class="composer-tool-btn">Templates</button>
                    </div>
                    <div class="composer-tools-right">
                      <button id="stopGenerationBtn" type="button" class="stop-btn hidden">Stop</button>
                      <button id="sendMessageBtn" type="button" class="send-btn" disabled>Send</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- Canvas Drawer -->
          <aside id="canvasDrawer" class="canvas-drawer hidden">
            <div class="canvas-header">
              <input id="canvasTitleInput" type="text" class="canvas-title-input" value="Untitled Canvas" />
              <button id="closeCanvasBtn" type="button" class="icon-btn">✕</button>
            </div>
            <textarea id="canvasTextarea" class="canvas-textarea" placeholder="Co-write and take notes here..."></textarea>
          </aside>
        </div>
      </main>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 class="modal-title">Settings & Gateway Configuration</h2>
          <button type="button" class="icon-btn" data-close-modal="settingsModal">✕</button>
        </div>
        <div class="modal-tabs">
          <button type="button" class="modal-tab-btn active" data-settings-tab="gateway">Gateway & Inference</button>
          <button type="button" class="modal-tab-btn" data-settings-tab="appearance">Appearance</button>
        </div>
        <div class="modal-body">
          <div id="settingsTabGateway" data-settings-panel="gateway" style="display:flex; flex-direction:column; gap:14px;">
            <div class="form-group">
              <label for="gatewayUrlInput" class="form-label">Cloudflare Tunnel URL</label>
              <input id="gatewayUrlInput" type="url" class="form-input" placeholder="https://your-tunnel.trycloudflare.com" />
              <span class="form-help" style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">
                Direct your requests to your Colab tunnel running <code>adapter_chat.py</code>.
              </span>
            </div>
          </div>
          <div id="settingsTabAppearance" data-settings-panel="appearance" class="hidden" style="display:none; flex-direction:column; gap:14px;">
            <div class="form-group">
              <label for="themeSelect" class="form-label">Theme</label>
              <select id="themeSelect" class="form-select">
                <option value="dark">Deep Charcoal</option>
                <option value="midnight">Midnight OLED</option>
                <option value="light">Daylight</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="settingsModal">Cancel</button>
          <button id="saveSettingsBtn" type="button" class="btn btn-primary">Save Settings</button>
        </div>
      </div>
    </div>

    <!-- PROMPT STUDIO MODAL -->
    <div id="promptStudioModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 class="modal-title">Prompt Studio</h2>
          <button type="button" class="icon-btn" data-close-modal="promptStudioModal">✕</button>
        </div>
        <div class="modal-body" id="promptStudioGrid"></div>
      </div>
    </div>

    <!-- TOAST REGION -->
    <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>

    <script>
      (() => {
        "use strict";

        const $ = (selector, root = document) => root.querySelector(selector);
        const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

        const MODEL = "Rainbow-AI-12B-Unified";
        const DEFAULT_GATEWAY = "https://satisfy-reserve-browser-wearing.trycloudflare.com";
        const STORAGE_KEY = "rainbow_ai_unified_state";
        const REQUEST_TIMEOUT = 120000; // 120s timeout for 12B token generation on T4

        const state = {
          gateway: DEFAULT_GATEWAY,
          conversations: [],
          activeId: null,
          busy: false,
          controller: null,
          theme: "dark",
          canvasOpen: false
        };

        const el = {
          input: $("#composerInput"),
          messages: $("#messagesList"),
          history: $("#chatHistoryList"),
          welcome: $("#welcomeScreen"),
          title: $("#activeChatTitle"),
          gateway: $("#gatewayUrlInput"),
          status: $("#gatewayStatusText"),
          statusDot: $("#gatewayStatusDot"),
          send: $("#sendMessageBtn"),
          scroll: $("#chatScrollContainer"),
          toast: $("#toastRegion")
        };

        /* ==========================================================================
           CUSTOM ASYNC DIALOG SYSTEM (NO BROWSER ALERTS/CONFIRMS/PROMPTS)
           ========================================================================== */
        function rainbowDialog(message, mode = "alert", defaultValue = "") {
          return new Promise((resolve) => {
            const existing = $("#rainbowActiveDialog");
            if (existing) existing.remove();

            const backdrop = document.createElement("div");
            backdrop.id = "rainbowActiveDialog";
            backdrop.className = "rainbow-dialog-backdrop";

            const card = document.createElement("div");
            card.className = "rainbow-dialog-card";

            const title = document.createElement("h2");
            title.textContent = "Rainbow AI";

            const body = document.createElement("p");
            body.textContent = message;

            card.append(title, body);

            let inputField = null;
            if (mode === "prompt") {
              inputField = document.createElement("input");
              inputField.type = "text";
              inputField.className = "form-input";
              inputField.value = defaultValue;
              inputField.style.width = "100%";
              inputField.style.marginBottom = "14px";
              card.appendChild(inputField);
            }

            const actions = document.createElement("div");
            actions.className = "rainbow-dialog-actions";

            let settled = false;
            const finish = (val) => {
              if (settled) return;
              settled = true;
              backdrop.remove();
              resolve(val);
            };

            if (mode !== "alert") {
              const cancelBtn = document.createElement("button");
              cancelBtn.type = "button";
              cancelBtn.className = "btn btn-secondary";
              cancelBtn.textContent = "Cancel";
              cancelBtn.onclick = () => finish(mode === "confirm" ? false : null);
              actions.appendChild(cancelBtn);
            }

            const okBtn = document.createElement("button");
            okBtn.type = "button";
            okBtn.className = "btn btn-primary";
            okBtn.textContent = mode === "confirm" ? "Continue" : mode === "prompt" ? "Save" : "OK";
            okBtn.onclick = () => finish(mode === "prompt" ? inputField.value : mode === "confirm" ? true : undefined);

            actions.appendChild(okBtn);
            card.appendChild(actions);
            backdrop.appendChild(card);
            document.body.appendChild(backdrop);

            if (inputField) inputField.focus();
            else okBtn.focus();
          });
        }

        window.alert = (msg) => { void rainbowDialog(msg, "alert"); };
        window.confirm = (msg) => rainbowDialog(msg, "confirm");
        window.prompt = (msg, def = "") => rainbowDialog(msg, "prompt", def);

        function notify(message) {
          if (!el.toast) return;
          const item = document.createElement("div");
          item.className = "toast-item";
          item.textContent = message;
          el.toast.appendChild(item);
          setTimeout(() => item.remove(), 4000);
        }

        function setStatus(message, online = true) {
          if (el.status) el.status.textContent = message;
          if (el.statusDot) {
            el.statusDot.classList.toggle("offline", !online);
          }
        }

        function activeConversation() {
          return state.conversations.find((c) => c.id === state.activeId);
        }

        function save() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              conversations: state.conversations,
              activeId: state.activeId,
              gateway: state.gateway,
              theme: state.theme
            }));
          } catch (e) {
            notify("Could not persist conversation. Local storage might be full.");
          }
        }

        function load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const saved = JSON.parse(raw);
            if (Array.isArray(saved.conversations)) {
              state.conversations = saved.conversations;
            }
            if (saved.activeId) state.activeId = saved.activeId;
            if (saved.gateway) state.gateway = saved.gateway;
            if (saved.theme) state.theme = saved.theme;
          } catch (e) {
            console.warn("Storage parse error:", e);
          }
        }

        function newConversation() {
          const chat = {
            id: String(Date.now()),
            title: "New Conversation",
            messages: []
          };
          state.conversations.unshift(chat);
          state.activeId = chat.id;
          save();
          renderAll();
          closeMobileSidebar();
          el.input?.focus();
          return chat;
        }

        function renderHistory() {
          if (!el.history) return;
          el.history.replaceChildren();

          state.conversations.forEach((chat) => {
            const row = document.createElement("div");
            row.className = "history-item-row";

            const btn = document.createElement("button");
            btn.className = "history-item" + (chat.id === state.activeId ? " active" : "");
            btn.textContent = chat.title || "New Conversation";
            btn.onclick = () => {
              state.activeId = chat.id;
              save();
              renderAll();
              closeMobileSidebar();
            };

            const del = document.createElement("button");
            del.className = "history-action-btn danger";
            del.textContent = "×";
            del.title = "Delete chat";
            del.onclick = async (e) => {
              e.stopPropagation();
              if (!await window.confirm(`Delete "${chat.title}"?`)) return;
              state.conversations = state.conversations.filter((c) => c.id !== chat.id);
              if (state.activeId === chat.id) {
                state.activeId = state.conversations[0]?.id || null;
              }
              if (!state.activeId) newConversation();
              else { save(); renderAll(); }
            };

            row.append(btn, del);
            el.history.appendChild(row);
          });
        }

        function renderMessages() {
          if (!el.messages) return;
          const chat = activeConversation();
          el.messages.replaceChildren();

          if (el.welcome) {
            el.welcome.classList.toggle("hidden", Boolean(chat && chat.messages.length));
          }

          if (el.title) {
            el.title.textContent = chat?.title || "New Conversation";
          }

          (chat?.messages || []).forEach((msg) => {
            const row = document.createElement("div");
            row.className = `message-row ${msg.role === "user" ? "user-row" : "assistant-row"}`;

            const header = document.createElement("div");
            header.className = "message-header";

            if (msg.role === "assistant") {
              const avatar = document.createElement("img");
              avatar.className = "message-avatar assistant-avatar-img";
              avatar.src = "./icon-new.png";
              header.appendChild(avatar);
            } else {
              const avatar = document.createElement("div");
              avatar.className = "message-avatar user-avatar";
              avatar.textContent = "Y";
              header.appendChild(avatar);
            }

            const label = document.createElement("span");
            label.textContent = msg.role === "user" ? "You" : "Rainbow-AI-12B";
            header.appendChild(label);

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";

            if (msg.role === "assistant" && window.marked && window.DOMPurify) {
              bubble.innerHTML = DOMPurify.sanitize(marked.parse(msg.content));
            } else {
              bubble.textContent = msg.content;
            }

            const actions = document.createElement("div");
            actions.className = "message-actions";

            const copy = document.createElement("button");
            copy.className = "message-action-btn";
            copy.textContent = "Copy";
            copy.onclick = async () => {
              await navigator.clipboard.writeText(msg.content);
              notify("Message copied.");
            };
            actions.appendChild(copy);

            row.append(header, bubble, actions);
            el.messages.appendChild(row);
          });

          if (el.scroll) el.scroll.scrollTop = el.scroll.scrollHeight;
        }

        function renderAll() {
          renderHistory();
          renderMessages();
        }

        async function sendMessage(textOverride = null) {
          if (state.busy) return;

          const text = String(textOverride ?? el.input?.value ?? "").trim();
          if (!text) return;

          let chat = activeConversation() || newConversation();
          const targetId = chat.id;

          chat.messages.push({ role: "user", content: text });
          if (chat.title === "New Conversation") {
            chat.title = text.slice(0, 36) + (text.length > 36 ? "…" : "");
          }

          if (el.input && textOverride === null) {
            el.input.value = "";
            el.input.style.height = "auto";
          }

          save();
          renderAll();

          state.busy = true;
          if (el.send) el.send.disabled = true;
          $("#stopGenerationBtn")?.classList.remove("hidden");
          state.controller = new AbortController();

          const timeoutId = setTimeout(() => state.controller?.abort(), REQUEST_TIMEOUT);
          setStatus("Generating…", true);

          try {
            const endpoint = `${state.gateway.replace(/\/+$/, "")}/call/predict`;
            const res = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              signal: state.controller.signal,
              body: JSON.stringify({ data: [text, MODEL] })
            });

            if (!res.ok) throw new Error(`Gateway returned HTTP ${res.status}`);

            const json = await res.json();
            const output = json.data && json.data[0] ? json.data[0] : "No response generated.";

            const current = state.conversations.find((c) => c.id === targetId);
            if (current) {
              current.messages.push({ role: "assistant", content: output });
              save();
            }
            setStatus("Gateway Ready", true);
          } catch (err) {
            const errText = err.name === "AbortError"
              ? "Request timed out or was cancelled."
              : `Connection error: ${err.message}. Confirm adapter_chat.py is active in Colab.`;

            const current = state.conversations.find((c) => c.id === targetId);
            if (current) {
              current.messages.push({ role: "assistant", content: errText });
              save();
            }
            setStatus("Gateway Offline", false);
          } finally {
            clearTimeout(timeoutId);
            state.busy = false;
            state.controller = null;
            if (el.send) el.send.disabled = !el.input?.value.trim();
            $("#stopGenerationBtn")?.classList.add("hidden");
            renderAll();
          }
        }

        /* Mobile Sidebar Helpers */
        function openMobileSidebar() {
          $("#appShell")?.classList.add("mobile-sidebar-open");
        }

        function closeMobileSidebar() {
          $("#appShell")?.classList.remove("mobile-sidebar-open");
        }

        $("#mobileMenuBtn")?.addEventListener("click", openMobileSidebar);
        $("#sidebarBackdrop")?.addEventListener("click", closeMobileSidebar);

        $("#sidebarCollapseBtn")?.addEventListener("click", () => {
          $("#appShell")?.classList.toggle("sidebar-collapsed");
        });

        /* Modals Management */
        function openModal(id) {
          $(`#${id}`)?.classList.remove("hidden");
        }

        function closeModal(id) {
          $(`#${id}`)?.classList.add("hidden");
        }

        $$("[data-close-modal]").forEach((btn) => {
          btn.addEventListener("click", () => closeModal(btn.dataset.closeModal));
        });

        $("#openSettingsBtn")?.addEventListener("click", () => {
          if (el.gateway) el.gateway.value = state.gateway;
          openModal("settingsModal");
        });

        $("#saveSettingsBtn")?.addEventListener("click", () => {
          const val = el.gateway?.value.trim();
          if (val) {
            state.gateway = val;
            save();
            notify("Settings saved.");
          }
          closeModal("settingsModal");
        });

        $("#themeSelect")?.addEventListener("change", (e) => {
          state.theme = e.target.value;
          document.documentElement.dataset.theme = state.theme;
          save();
        });

        /* Settings Tabs */
        $$("[data-settings-tab]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const tab = btn.dataset.settingsTab;
            $$("[data-settings-tab]").forEach((b) => b.classList.toggle("active", b === btn));
            $$("[data-settings-panel]").forEach((p) => {
              const active = p.dataset.settingsPanel === tab;
              p.classList.toggle("hidden", !active);
              p.style.display = active ? "flex" : "none";
            });
          });
        });

        /* Starter Prompts */
        const starters = [
          "Explain the technical architecture of Rainbow-AI-12B-Unified.",
          "Write an optimized FastAPI endpoint with async background processing.",
          "Debug a CUDA out-of-memory issue during LLM generation.",
          "Design a complete client-side caching pipeline in JavaScript."
        ];

        function renderStarters() {
          const grid = $("#starterPromptsGrid");
          if (!grid) return;
          grid.replaceChildren();
          starters.forEach((prompt) => {
            const card = document.createElement("button");
            card.className = "starter-card";
            card.textContent = prompt;
            card.onclick = () => sendMessage(prompt);
            grid.appendChild(card);
          });
        }

        /* Composer Listeners */
        el.input?.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

        el.input?.addEventListener("input", () => {
          el.input.style.height = "auto";
          el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px";
          if (el.send) el.send.disabled = !el.input.value.trim() || state.busy;
        });

        el.send?.addEventListener("click", () => sendMessage());

        $("#stopGenerationBtn")?.addEventListener("click", () => {
          state.controller?.abort();
        });

        $("#newChatBtn")?.addEventListener("click", newConversation);
        $("#brandHomeBtn")?.addEventListener("click", newConversation);

        $("#clearCurrentChatBtn")?.addEventListener("click", async () => {
          const chat = activeConversation();
          if (!chat) return;
          if (!await window.confirm("Clear all messages in this conversation?")) return;
          chat.messages = [];
          chat.title = "New Conversation";
          save();
          renderAll();
        });

        $("#exportCurrentChatBtn")?.addEventListener("click", () => {
          const chat = activeConversation();
          if (!chat || !chat.messages.length) return notify("No messages to export.");
          let md = `# ${chat.title}\n\n`;
          chat.messages.forEach((m) => {
            md += `### ${m.role === "user" ? "You" : "Rainbow-AI-12B"}\n${m.content}\n\n`;
          });
          const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `${chat.title.replace(/[^a-z0-9]/gi, "_")}.md`;
          a.click();
        });

        $("#canvasToggleBtn")?.addEventListener("click", () => {
          state.canvasOpen = !state.canvasOpen;
          $("#canvasDrawer")?.classList.toggle("hidden", !state.canvasOpen);
          $("#canvasToggleBtn")?.classList.toggle("active", state.canvasOpen);
        });

        $("#sidebarCanvasBtn")?.addEventListener("click", () => {
          state.canvasOpen = true;
          $("#canvasDrawer")?.classList.remove("hidden");
          $("#canvasToggleBtn")?.classList.add("active");
          closeMobileSidebar();
        });

        $("#closeCanvasBtn")?.addEventListener("click", () => {
          state.canvasOpen = false;
          $("#canvasDrawer")?.classList.add("hidden");
          $("#canvasToggleBtn")?.classList.remove("active");
        });

        // Initialize
        load();
        document.documentElement.dataset.theme = state.theme;
        renderStarters();

        if (!activeConversation()) newConversation();
        else renderAll();
      })();
    </script>
  </body>
</html>
