<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow AI Specialist Dashboard 🌈✨</title>
    <!-- Include WebLLM script from CDN -->
    <script type="module">
      import * as webllm from "https://esm.run/@mlc-ai/web-llm";
      window.webllm = webllm;
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; text-align: center; }
        #status { background: #334155; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-family: monospace; font-size: 14px; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; font-size: 16px; margin-bottom: 10px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        pre { background: #0f172a; padding: 15px; border-radius: 6px; overflow-x: auto; border: 1px solid #334155; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Rainbow AI Specialist 🌈🚀</h1>
    <div id="status">Initializing WebLLM engine...</div>

    <label for="prompt">Ask your trading specialist for code:</label><br>
    <textarea id="prompt">Write a Python pandas trading strategy using moving average crossovers.</textarea><br>
    <button id="generateBtn" disabled>Generate Code</button>

    <h3>Output:</h3>
    <pre id="output">Model is still loading...</pre>
</div>

<script type="module">
    let engine;
    const statusDiv = document.getElementById("status");
    const outputDiv = document.getElementById("output");
    const generateBtn = document.getElementById("generateBtn");
    const promptInput = document.getElementById("prompt");

    async function initializeEngine() {
        try {
            // Pointing directly to your custom merged model on Hugging Face
            const selectedModel = "RainbowLord/Rainbow-AI-Specialist-Merged";
            
            engine = await webllm.CreateMLCEngine(selectedModel, {
                initProgressCallback: (progress) => {
                    statusDiv.textContent = progress.text;
                }
            });

            statusDiv.textContent = "Status: Ready! Your custom WebGPU model is loaded. ✨";
            generateBtn.disabled = false;
            outputDiv.textContent = "System ready. Click 'Generate Code' to test!";
        } catch (error) {
            statusDiv.textContent = "Error initializing model: " + error.message;
            console.error(error);
        }
    }

    generateBtn.addEventListener("click", async () => {
        if (!engine) return;
        
        outputDiv.textContent = "Thinking and writing code... 🤖💻";
        generateBtn.disabled = true;

        try {
            const userPrompt = promptInput.value;
            const reply = await engine.chat.completions.create({
                messages: [{ role: "user", content: userPrompt }],
                temperature: 0.3, // Low temperature for clean, strict code formatting
            });

            outputDiv.textContent = reply.choices[0].message.content;
        } catch (error) {
            outputDiv.textContent = "Generation error: " + error.message;
        } finally {
            generateBtn.disabled = false;
        }
    });

    // Start loading the model automatically on page open
    initializeEngine();
</script>

</body>
</html>
