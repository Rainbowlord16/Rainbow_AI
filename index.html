<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow AI Dashboard Preview</title>
    <style>
      :root {
        --bg-base: #0b0f19;
        --sidebar-bg: rgba(15, 23, 42, 0.85);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.08);
        --panel-bg: rgba(30, 41, 59, 0.6);
        --bubble-user: linear-gradient(135deg, #3b82f6, #8b5cf6);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 100%; height: 100vh;
        background: var(--bg-base);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      /* --- LOADING SCREEN OVERLAY --- */
      #loadingOverlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #0b0f19;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #loadingOverlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .logo-box {
        width: 120px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      .progress-bar-wrap {
        width: 240px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
        transition: width 0.3s ease-out;
      }
      .loading-text {
        font-size: 13px;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      /* --- DASHBOARD UI --- */
      .app-layout {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      .sidebar {
        width: 260px;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border-color);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .brand-title {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chat-view {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .header-bar {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border-color);
        background: var(--panel-bg);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat-content {
        flex: 1;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .bubble {
        padding: 14px 18px;
        border-radius: 14px;
        font-size: 14px;
        max-width: 60%;
        line-height: 1.5;
      }
      .bubble.ai {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
      }
    </style>
  </head>
  <body>

    <!-- 1. The Dynamic Logo Bar Cycle Overlay -->
    <div id="loadingOverlay">
      <div class="logo-box" id="logoBox">
        <!-- SVG injected by JS -->
      </div>
      <div class="loading-text" id="statusLabel">Initializing WebGPU Shader Nodes...</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 2. The Main Interface -->
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand-title">
          <!-- Sheet 1 Brand Mark: Apex Triangle -->
          <svg width="24" height="24" viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="18" r="8" fill="#fb923c" />
            <polygon points="50,30 36,54 64,54" stroke="#818cf8" stroke-width="6" fill="none" stroke-linejoin="round" />
            <path d="M 20 85 A 36 36 0 0 1 80 85" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
          </svg>
          Rainbow AI
        </div>
        <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Workspace</div>
        <div style="padding: 8px 12px; background: rgba(139, 92, 246, 0.2); border-radius: 8px; font-size: 13px;">💬 Chat Node</div>
        <div style="padding: 8px 12px; font-size: 13px; color: var(--text-muted);">🎨 Spectra Studio</div>
        <div style="padding: 8px 12px; font-size: 13px; color: var(--text-muted);">🛡️ Nova Mode</div>
      </aside>

      <main class="chat-view">
        <div class="header-bar">
          <h3 style="font-size: 15px;">Rainbow AI Trading Specialist Node</h3>
          <span style="font-size: 12px; color: #10b981; background: rgba(16,185,129,0.15); padding: 4px 10px; border-radius: 12px;">● Node Active</span>
        </div>
        <div class="chat-content">
          <div class="bubble ai">
            Neural pipeline initialized. System ready for Python strategy and algorithm execution.
          </div>
        </div>
      </main>
    </div>

    <script>
      // The 4 distinct Logo variants from Sheet 2 (AI Rainbow Product Sheet)
      const stages = [
        {
          label: "Allocating WebGPU Unified Memory (1/4)...",
          pct: "25%",
          // Stage 1: Motion Arch
          svg: `<svg width="100" height="70" viewBox="0 0 100 80" fill="none">
                  <path d="M 50 15 A 35 35 0 0 1 85 50 L 70 50 A 20 20 0 0 0 50 30 Z" fill="#3b82f6"/>
                  <rect x="15" y="32" width="22" height="6" rx="3" fill="#60a5fa"/>
                  <rect x="8" y="44" width="35" height="6" rx="3" fill="#3b82f6"/>
                  <rect x="18" y="56" width="20" height="6" rx="3" fill="#2563eb"/>
                </svg>`
        },
        {
          label: "Streaming 4-Bit Gemma Tensors (2/4)...",
          pct: "55%",
          // Stage 2: Pixel Extrusion
          svg: `<svg width="100" height="70" viewBox="0 0 100 80" fill="none">
                  <path d="M 15 65 A 35 35 0 0 1 65 15 L 65 30 A 20 20 0 0 0 30 65 Z" fill="#0284c7"/>
                  <rect x="68" y="16" width="8" height="8" fill="#38bdf8"/>
                  <rect x="78" y="16" width="8" height="8" fill="#c084fc"/>
                  <rect x="78" y="26" width="8" height="8" fill="#e879f9"/>
                  <rect x="68" y="36" width="8" height="8" fill="#f43f5e"/>
                  <rect x="78" y="46" width="8" height="8" fill="#ec4899"/>
                </svg>`
        },
        {
          label: "Compiling Metal / Vulkan Kernels (3/4)...",
          pct: "80%",
          // Stage 3: Low-Poly Geometric
          svg: `<svg width="100" height="70" viewBox="0 0 100 80" fill="none">
                  <polygon points="20,65 30,35 50,20" fill="#0284c7"/>
                  <polygon points="50,20 70,35 80,65" fill="#f59e0b"/>
                  <polygon points="50,20 30,35 50,45" fill="#06b6d4"/>
                  <polygon points="50,20 70,35 50,45" fill="#10b981"/>
                  <polygon points="30,35 50,45 35,65" fill="#3b82f6"/>
                  <polygon points="70,35 50,45 65,65" fill="#ef4444"/>
                </svg>`
        },
        {
          label: "Neural Architecture Ready (4/4)...",
          pct: "100%",
          // Stage 4: Skyline Arch
          svg: `<svg width="100" height="70" viewBox="0 0 100 80" fill="none">
                  <path d="M 10 70 A 40 40 0 0 1 90 70 L 76 70 L 76 56 L 66 56 L 66 46 L 54 46 L 54 52 L 46 52 L 46 46 L 34 46 L 34 56 L 24 56 L 24 70 Z" fill="url(#gradFinal)"/>
                  <defs>
                    <linearGradient id="gradFinal" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#3b82f6"/>
                      <stop offset="35%" stop-color="#06b6d4"/>
                      <stop offset="70%" stop-color="#eab308"/>
                      <stop offset="100%" stop-color="#ef4444"/>
                    </linearGradient>
                  </defs>
                </svg>`
        }
      ];

      let currentStep = 0;
      const logoBox = document.getElementById("logoBox");
      const statusLabel = document.getElementById("statusLabel");
      const progressFill = document.getElementById("progressFill");
      const overlay = document.getElementById("loadingOverlay");

      function showStage(step) {
        logoBox.style.opacity = "0";
        logoBox.style.transform = "scale(0.85)";

        setTimeout(() => {
          logoBox.innerHTML = stages[step].svg;
          statusLabel.textContent = stages[step].label;
          progressFill.style.width = stages[step].pct;
          logoBox.style.opacity = "1";
          logoBox.style.transform = "scale(1)";
        }, 150);
      }

      // Initial stage
      showStage(0);

      // Cycle every 800ms
      const interval = setInterval(() => {
        currentStep++;
        if (currentStep < stages.length) {
          showStage(currentStep);
        } else {
          clearInterval(interval);
          setTimeout(() => {
            overlay.classList.add("fade-out");
          }, 400);
        }
      }, 800);
    </script>
  </body>
</html>
